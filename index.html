<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset=" UTF-8">
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0">
    <title>spendWise Budget tracker</title>
<link rel="stylesheet"
href="style.css">
</head>

</body>
      <header>
        </h1>spendWise</h1>
           <h1>💰 SpendWise</h1>
            <p>Track your expenses and manage your budget wisely.</p>
        </header>

        <!-- Budget Section -->
        <section class="card">
            <h2>Set Your Budget</h2>

            <div class="form-row">
                <input
                    type="number"
                    id="budgetInput"
                    placeholder="Enter your budget"
                    min="1"
                >

                <button id="budgetButton">
                    Set Budget
                </button>
            </div>
        </section>

        <!-- Dashboard -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Budget</h3>
                <p id="budgetDisplay">KSh 10,000</p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p id="totalExpenses">KSh 0</p>
            </div>

            <div class="card">
                <h3>Remaining</h3>
                <p id="remainingBudget">KSh 10,000</p>
            </div>

        </section>

        <!-- Budget Feedback -->
        <section class="card">
            <h2>Budget Status</h2>
            <p id="budgetMessage">
                ✅ You are within your budget.
            </p>
        </section>

        <!-- Add Expense -->
        <section class="card">
            <h2>Add an Expense</h2>

            <form id="expenseForm">

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense name"
                    required
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount"
                    min="1"
                    required
                >

                <select id="expenseCategory" required>
                    <option value="">Select category</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">
                    Add Expense
                </button>

            </form>
        </section>

        <!-- Expense List -->
        <section class="card">
            <h2>Expense Records</h2>

            <ul id="expenseList"></ul>

            <p id="emptyMessage">No expenses added yet.</p>
        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>
